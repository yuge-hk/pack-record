name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            .github/build-constraints.txt
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-dev.txt -c .github/build-constraints.txt
      - name: Download and verify FFmpeg
        run: python packaging/fetch_windows_ffmpeg.py
      - name: Run tests with real synthetic media
        shell: pwsh
        run: |
          $env:ECOM_TEST_FFMPEG = (Resolve-Path tools/ffmpeg.exe).Path
          $env:ECOM_TEST_FFPROBE = (Resolve-Path tools/ffprobe.exe).Path
          python -m pytest -q --junitxml=dist/test-results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build EXE and portable ZIP
        shell: pwsh
        run: ./build-windows.ps1 -SkipDependencyInstall
      - name: Check packaged GUI and thread shutdown
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/pack-record.exe).Path -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Packaged self-test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed: $($process.ExitCode)" }
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pack-record-windows-x64
          path: |
            dist/pack-record-v2.0.0-windows-x64.zip
            dist/pack-record-v2.0.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results
          path: dist/test-results.xml
          if-no-files-found: ignore
          retention-days: 14
